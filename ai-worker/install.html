<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کد اتصال تبدیل صدا</title><style>body{font:18px system-ui;max-width:700px;margin:30px auto;padding:20px;color:#17362f}button{font:inherit;padding:14px 24px;background:#17362f;color:white;border:0;border-radius:12px}textarea{width:100%;height:400px;box-sizing:border-box;margin-top:20px;direction:ltr;font:14px monospace}</style><h1>کد اصلاح‌شدهٔ Worker</h1><p>نسخهٔ ۹۰ — ورود جدول از عکس — کد زیر را کامل جایگزین worker.js در Cloudflare کن و Deploy را بزن. کلید موجود در Secrets استفاده می‌شود.</p><button id="copy" disabled>کپی کل کد</button><p id="status" role="status">در حال دریافت کد…</p><textarea id="code" readonly aria-label="کد Worker"></textarea><script>
fetch('./worker.js?v=90').then(r=>{if(!r.ok)throw Error();return r.text()}).then(code=>{document.getElementById('code').value=code;document.getElementById('copy').disabled=false;document.getElementById('status').textContent='کد آماده است.'}).catch(()=>document.getElementById('status').textContent='دریافت کد انجام نشد؛ صفحه را دوباره باز کن.');
document.getElementById('copy').onclick=async()=>{const box=document.getElementById('code');try{await navigator.clipboard.writeText(box.value);document.getElementById('status').textContent='کل کد کپی شد؛ در ویرایشگر Cloudflare جای‌گذاری کن.'}catch{box.focus();box.select();box.setSelectionRange(0,box.value.length);document.getElementById('status').textContent='کد انتخاب شد؛ گزینهٔ Copy را بزن.'}};
</script></html>
