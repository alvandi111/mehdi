    #peymanyarIntro[hidden]{display:none!important}
    #peymanyarIntro{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#17362f;isolation:isolate;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);box-sizing:border-box}
    #peymanyarIntroVideo{display:block;width:min(94vw,76vh,680px);height:auto;max-width:100%;max-height:86vh;object-fit:contain;background:#17362f}
    #peymanyarIntroSkip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #e2c99566;border-radius:999px;padding:10px 22px;min-height:44px;color:#ead3a0;background:#17362f;font:inherit;cursor:pointer;white-space:nowrap}
    #peymanyarIntroSkip:focus-visible{outline:2px solid #ead3a0;outline-offset:4px}
    @media(orientation:landscape) and (max-height:500px){#peymanyarIntroVideo{max-height:92vh;width:auto}#peymanyarIntroSkip{left:auto;right:16px;transform:none;bottom:16px}}

  <section id="peymanyarIntro" hidden role="dialog" aria-modal="true" aria-label="به پیمان‌یار خوش آمدید">
    <video id="peymanyarIntroVideo" muted autoplay playsinline webkit-playsinline preload="auto" poster="assets/peymanyar-intro-126.jpg" aria-label="رسم اسکچ پیمان‌یار؛ از زون دیزاین">

    </video>

  </section>
  <script id="peymanyarIntroController">
  (function(){
    'use strict';
    const intro=document.getElementById('peymanyarIntro'),video=document.getElementById('peymanyarIntroVideo'),app=document.getElementById('app');
    if(!intro||!video||!app)return;
    let done=false,timer;
    const wasInert=app.hasAttribute('inert'),previousAria=app.getAttribute('aria-hidden');
    function finish(){
      if(done)return;done=true;clearTimeout(timer);
      document.removeEventListener('keydown',escape);document.removeEventListener('visibilitychange',visibility);
      try{video.pause()}catch(e){}
      intro.remove();
      if(!wasInert)app.removeAttribute('inert');
      if(previousAria===null)app.removeAttribute('aria-hidden');else app.setAttribute('aria-hidden',previousAria);
    }
    function escape(e){if(e.key==='Escape')finish()}
    function visibility(){if(document.hidden)finish()}
    // The app starts underneath immediately. Media never gates data loading.
    timer=setTimeout(finish,4300);
    try{
      intro.hidden=false;app.setAttribute('inert','');app.setAttribute('aria-hidden','true');
      document.getElementById('peymanyarIntroSkip').addEventListener('click',finish);
      document.addEventListener('keydown',escape);document.addEventListener('visibilitychange',visibility);
      video.addEventListener('ended',finish,{once:true});
      video.addEventListener('error',finish,{once:true});
      video.querySelector('source')?.addEventListener('error',finish,{once:true});
      if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){
        video.autoplay=false;video.removeAttribute('autoplay');video.pause();clearTimeout(timer);timer=setTimeout(finish,450);return;
      }
      video.muted=true;video.defaultMuted=true;video.playsInline=true;
      const playing=video.play();if(playing?.catch)playing.catch(finish);
    }catch(e){finish()}
  })();
  </script>
