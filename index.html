  <script id="peymanyarIntroController">
  (function(){
    'use strict';
    const intro=document.getElementById('peymanyarIntro'),app=document.getElementById('app');
    if(!intro||!app)return;
    let done=false,timer;
    const wasInert=app.hasAttribute('inert'),previousAria=app.getAttribute('aria-hidden');
    function finish(){if(done)return;done=true;clearTimeout(timer);document.removeEventListener('keydown',escape);document.removeEventListener('visibilitychange',visibility);intro.remove();if(!wasInert)app.removeAttribute('inert');if(previousAria===null)app.removeAttribute('aria-hidden');else app.setAttribute('aria-hidden',previousAria)}
    function escape(e){if(e.key==='Escape')finish()}
    function visibility(){if(document.hidden)finish()}
    // Inline vector animation has no media or network dependency; app loads concurrently.
    timer=setTimeout(finish,2600);
    try{
      intro.hidden=false;app.setAttribute('inert','');app.setAttribute('aria-hidden','true');
      document.getElementById('peymanyarIntroSkip').addEventListener('click',finish);
      document.addEventListener('keydown',escape);document.addEventListener('visibilitychange',visibility);
      if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){clearTimeout(timer);timer=setTimeout(finish,450);return}
      intro.classList.add('is-entering');
    }catch(e){finish()}
  })();
